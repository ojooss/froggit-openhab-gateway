monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - froggit # Froggit-Weather-Data
        - openhab # openHAB-Publisher

when@dev: &dev
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!froggit"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            froggit:
                type: stream
                path: "%kernel.logs_dir%/froggit.log"
                level: debug
                channels: [ "froggit" ]
            openhab:
                type: stream
                path: "%kernel.logs_dir%/openhab.log"
                level: debug
                channels: [ "openhab" ]

when@test:
    *dev

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: ["!froggit", "!deprecation"]
            nested:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            froggit:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/froggit.log"
                level: info
                channels: [ "froggit" ]
            openhab:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/openhab.log"
                level: info
                channels: [ "openhab" ]
