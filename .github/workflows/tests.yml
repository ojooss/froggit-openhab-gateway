name: Tests

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    # Mirrors docker/docker-compose.dev.yaml's throwaway local MariaDB + InfluxDB:
    # FroggitServiceTest::testPersist and DataViewControllerTest need a real,
    # reachable MariaDB/InfluxDB (see AGENTS.md "Testing"), not just non-empty URLs.
    # OPENHAB_URL stays empty on purpose — that sink is disabled during tests.
    services:
      mariadb:
        image: mariadb:12.1.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: froggit
          MARIADB_USER: froggit
          MARIADB_PASSWORD: froggit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      influxdb:
        image: influxdb:2.7
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: dev-password
          DOCKER_INFLUXDB_INIT_ORG: froggit
          DOCKER_INFLUXDB_INIT_BUCKET: froggit
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token
        ports:
          - 8086:8086

    env:
      APP_ENV: test
      MYSQL_URL: mysql://froggit:froggit@127.0.0.1:3306/froggit?serverVersion=12.1.2-MariaDB
      MYSQL_TABLE: data
      INFLUXDB_URL: http://127.0.0.1:8086
      INFLUXDB_TOKEN: dev-token
      INFLUXDB_ORG: froggit
      INFLUXDB_BUCKET: froggit
      OPENHAB_URL: ''
      OPENHAB_TOKEN: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Wait for InfluxDB
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8086/health && exit 0
            sleep 2
          done
          echo "InfluxDB did not become healthy in time" >&2
          exit 1

      # Creates the data_froggit table LoadFixturesCommand/tests need (DataWriter
      # no longer creates tables lazily) and seeds sample rows; also retries its
      # own MariaDB connection a few times in case the service is still starting.
      - name: Seed test data
        run: php bin/console app:fixtures:load

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: composer phpstan

  rector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Check Rector rules (dry run)
        run: composer rector:dry

  composer-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

  # Only runs for a version tag push, and only once phpunit/phpstan/rector/composer-audit
  # (above) have all passed on that exact commit — `needs` re-runs those checks against the
  # tagged commit rather than trusting that some earlier PR check covered it.
  docker-publish:
    needs: [phpunit, phpstan, rector, composer-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
